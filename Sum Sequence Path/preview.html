<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisano Paths Preview — Trevorything.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #041c1c;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            bottom: 14px;
            left: 14px;
            color: rgba(194, 237, 237, 0.6);
            font-size: 11px;
            font-weight: 500;
            pointer-events: none;
            background: rgba(10, 46, 46, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 0.01em;
        }
    </style>
</head>
<body>
    <canvas id="previewCanvas"></canvas>
    <div id="info">Loading...</div>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');

        const SEQUENCE_LENGTH = 2000;

        // --- White-to-Teal Gradient Color Stops ---
        const GRADIENT_STOPS = [
            { pos: 0.00, r: 240, g: 250, b: 250 }, // --white  #f0fafa
            { pos: 0.25, r: 194, g: 237, b: 237 }, // --lightest #c2eded
            { pos: 0.50, r: 143, g: 216, b: 216 }, // --lighter  #8fd8d8
            { pos: 0.75, r: 94,  g: 194, b: 194 }, // --light    #5ec2c2
            { pos: 1.00, r: 26,  g: 92,  b: 92  }  // --teal     #1a5c5c
        ];

        function getGradientColor(t) {
            t = Math.max(0, Math.min(1, t));
            let lower = GRADIENT_STOPS[0];
            let upper = GRADIENT_STOPS[GRADIENT_STOPS.length - 1];
            for (let s = 0; s < GRADIENT_STOPS.length - 1; s++) {
                if (t >= GRADIENT_STOPS[s].pos && t <= GRADIENT_STOPS[s + 1].pos) {
                    lower = GRADIENT_STOPS[s];
                    upper = GRADIENT_STOPS[s + 1];
                    break;
                }
            }
            const range = upper.pos - lower.pos;
            const localT = range === 0 ? 0 : (t - lower.pos) / range;
            const r = Math.round(lower.r + (upper.r - lower.r) * localT);
            const g = Math.round(lower.g + (upper.g - lower.g) * localT);
            const b = Math.round(lower.b + (upper.b - lower.b) * localT);
            return `rgb(${r},${g},${b})`;
        }

        function generateSequence(x1, x2, mod) {
            const length = SEQUENCE_LENGTH;
            const seq = [x1, x2];
            if (length < 2) return seq.slice(0, length);
            for (let i = 2; i < length; i++) {
                const nextVal = (BigInt(seq[i - 1]) + BigInt(seq[i - 2])) % BigInt(mod);
                seq.push(Number(nextVal));
            }
            return seq;
        }

        function calculatePathCoords(sequence, mod, sides) {
            let x = 0, y = 0;
            const xCoords = [x], yCoords = [y];
            if (sides < 1) sides = 1;
            const angleIncrementRad = (2 * Math.PI) / sides;
            sequence.forEach((value, i) => {
                const distance = (value === 0) ? mod : value;
                const currentAngleRad = i * angleIncrementRad;
                const dx = Math.cos(currentAngleRad);
                const dy = Math.sin(currentAngleRad);
                x += dx * distance;
                y += dy * distance;
                xCoords.push(x);
                yCoords.push(y);
            });
            return { xCoords, yCoords };
        }

        function drawPath(context, xCoords, yCoords) {
            const width = context.canvas.width;
            const height = context.canvas.height;
            context.fillStyle = '#041c1c';
            context.fillRect(0, 0, width, height);

            if (xCoords.length < 2) return;
            let minX = xCoords[0], maxX = xCoords[0], minY = yCoords[0], maxY = yCoords[0];
            for (let i = 1; i < xCoords.length; i++) {
                minX = Math.min(minX, xCoords[i]);
                maxX = Math.max(maxX, xCoords[i]);
                minY = Math.min(minY, yCoords[i]);
                maxY = Math.max(maxY, yCoords[i]);
            }
            const pathWidth = maxX - minX;
            const pathHeight = maxY - minY;
            if (pathWidth === 0 && pathHeight === 0) return;

            const padding = 20;
            const effectiveCanvasWidth = width - 2 * padding;
            const effectiveCanvasHeight = height - 2 * padding;
            const scaleX = pathWidth === 0 ? 1 : effectiveCanvasWidth / pathWidth;
            const scaleY = pathHeight === 0 ? 1 : effectiveCanvasHeight / pathHeight;
            const scale = Math.min(scaleX, scaleY) * 0.95;
            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;
            const translateX = width / 2 - centerX * scale;
            const translateY = height / 2 - centerY * scale;
            const transformedX = xCoords.map(x => translateX + x * scale);
            const transformedY = yCoords.map(y => translateY + y * scale);

            // Draw Shaded Area
            context.beginPath();
            context.moveTo(transformedX[0], transformedY[0]);
            for (let i = 1; i < transformedX.length; i++) {
                context.lineTo(transformedX[i], transformedY[i]);
            }
            context.fillStyle = 'rgba(142, 216, 216, 0.08)';
            context.fill();

            // Draw White-to-Teal Gradient Lines
            const totalSegments = transformedX.length - 1;
            context.lineWidth = 3;
            context.lineCap = 'round';
            context.lineJoin = 'round';
            for (let i = 0; i < totalSegments; i++) {
                 const x1 = transformedX[i];
                 const y1 = transformedY[i];
                 const x2 = transformedX[i+1];
                 const y2 = transformedY[i+1];
                 const t = totalSegments <= 1 ? 0 : i / (totalSegments - 1);
                 context.strokeStyle = getGradientColor(t);
                 context.beginPath();
                 context.moveTo(x1, y1);
                 context.lineTo(x2, y2);
                 context.stroke();
             }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function randomizeAndDraw() {
            const mod = Math.floor(Math.random() * 100) + 10;
            const x1 = Math.floor(Math.random() * 10);
            const x2 = Math.floor(Math.random() * 10);
            const sides = Math.floor(Math.random() * 6) + 3;

            info.textContent = `Mod: ${mod}, Start: (${x1},${x2}), Sides: ${sides}`;

            const sequence = generateSequence(x1, x2, mod);
            const { xCoords, yCoords } = calculatePathCoords(sequence, mod, sides);
            drawPath(ctx, xCoords, yCoords);
        }

        randomizeAndDraw();
        setInterval(randomizeAndDraw, 3000);

    </script>
</body>
</html>

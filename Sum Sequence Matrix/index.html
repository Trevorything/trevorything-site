<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Sequence Modular Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Basic styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* bg-gray-900 */
            color: #f9fafb; /* text-gray-50 */
            @apply min-h-screen;
        }

        /* Grid cell styling */
        .grid-cell {
            @apply border border-gray-600 flex items-center justify-center text-xs transition-all duration-150 cursor-pointer relative overflow-hidden;
            aspect-ratio: 1 / 1;
            transition: background-color 0.2s ease-in-out, transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .grid-cell:hover {
            @apply ring-2 ring-offset-2 ring-teal-400 ring-offset-gray-900 z-10;
            transform: scale(1.1);
        }
        /* Style for highlighted sequence cells */
        .highlight-sequence {
             box-shadow: inset 0 0 0 2px #FFBF00;
        }


        /* Label styling */
        .label {
            background-color: #1f2937; /* bg-gray-800 */
            color: #d1d5db; /* text-gray-300 */
            @apply flex items-center justify-center font-semibold text-sm p-1;
            min-width: 2.5rem;
            min-height: 2.5rem;
        }

        /* Highlight styling */
        .highlight-label {
            background-color: #134e4a; /* bg-teal-800 */
            color: #ccfbf1; /* text-teal-100 */
            @apply font-bold;
        }

        /* Grid container */
        #gridContainer {
            display: grid;
            gap: 2px;
            background-color: #374151; /* bg-gray-700 */
            @apply p-2 rounded-lg overflow-auto shadow-lg;
            max-width: 90vw;
            max-height: 75vh;
            margin: auto;
        }

        /* Sequence details */
         #sequenceDetails {
            min-height: 4.5em;
            background-color: #1f2937; /* bg-gray-800 */
            color: #d1d5db; /* text-gray-300 */
            @apply p-4 mb-6 border border-gray-700 rounded-lg shadow-md;
            word-break: break-all;
         }

        /* Input style */
        input[type="number"] {
             background-color: #374151; /* bg-gray-700 */
             color: #f9fafb; /* text-gray-50 */
             border-color: #4b5563; /* border-gray-600 */
             @apply px-4 py-2 rounded-md border focus:outline-none focus:ring-2 focus:ring-teal-500 placeholder-gray-400;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <h1 class="text-2xl md:text-3xl font-bold text-center mb-6" style="color: #5eead4;">Sum Sequence Modular Matrix</h1>

    <div class="flex flex-wrap justify-center items-center gap-4 mb-6">
        <label for="modulusInput" class="font-medium" style="color: #d1d5db;">Modulus (n):</label>
        <input type="number" id="modulusInput" min="2" max="50" value="10" class="w-20 text-center">
    </div>

    <div id="sequenceDetails" class="text-center text-sm">
        Enter a modulus (2-50). Grid will generate automatically. Click a square for details.
    </div>

    <div id="gridContainerWrapper" class="flex justify-center">
         <div id="gridContainer">
            </div>
    </div>

    <script>
        // DOM Elements
        const modulusInput = document.getElementById('modulusInput');
        const gridContainer = document.getElementById('gridContainer');
        const sequenceDetails = document.getElementById('sequenceDetails');

        // Global state
        let sequences = [];
        let cellInfo = new Map(); // Stores { sequenceIndex, color } for each "row,col"
        let cellElements = new Map(); // Stores DOM element for each "row,col"
        let currentModulus = 0;
        let colLabels = [];
        let rowLabels = [];
        let debounceTimer;
        let highlightedSequenceIndex = null; // Track the currently highlighted sequence index
        let selectedPair = null; // Track the coordinates [row, col] of the selected cell

        // --- Debounce Function ---
        function debounce(func, delay) {
            return function(...args) {
                clearTimeout(debounceTimer);
                // Keep current details visible while waiting, or show 'waiting'
                // sequenceDetails.textContent = 'Waiting for input...';
                debounceTimer = setTimeout(() => {
                    func.apply(this, args);
                }, delay);
            };
        }

        // --- Grid Generation Logic ---
        function generateGrid() {
            clearTimeout(debounceTimer);
            const previousSelectedPair = selectedPair;
            selectedPair = null;
            highlightedSequenceIndex = null;

            const n = parseInt(modulusInput.value);
            if (isNaN(n) || n < 2 || n > 50) {
                sequenceDetails.innerHTML = `<strong style="color: #f87171;">Error:</strong> Please enter a valid modulus (n) between 2 and 50.`;
                gridContainer.innerHTML = '';
                sequences = []; cellInfo.clear(); cellElements.clear(); currentModulus = 0;
                return;
            }

            if (n === currentModulus && sequences.length > 0) {
                 selectedPair = previousSelectedPair; // Restore selection state
                 if(selectedPair) {
                    const pairStr = `${selectedPair[0]},${selectedPair[1]}`;
                    const info = cellInfo.get(pairStr);
                    if(info) highlightedSequenceIndex = info.sequenceIndex;
                 }
                 sequenceDetails.textContent = `Grid for n=${n} already shown. Click a square for details.`;
                 return;
            }

            currentModulus = n;
            gridContainer.innerHTML = '';
            sequenceDetails.textContent = 'Generating... Please wait.';
            sequences = []; cellInfo.clear(); cellElements.clear(); colLabels = []; rowLabels = [];
            const visited = new Set();

            // --- Find all sequences/cycles ---
            let tempCellInfo = new Map();
            let sequenceIndex = 0;
            for (let startRow = 0; startRow < n; startRow++) {
                for (let startCol = 0; startCol < n; startCol++) {
                    const startPairStr = `${startRow},${startCol}`;
                    if (!visited.has(startPairStr)) {
                        const currentSequence = [];
                        let currentRow = startRow; let currentCol = startCol;
                        let currentPairStr = `${currentRow},${currentCol}`;
                        while (!visited.has(currentPairStr)) {
                            visited.add(currentPairStr);
                            currentSequence.push([currentRow, currentCol]);
                            tempCellInfo.set(currentPairStr, { sequenceIndex });
                            const nextRow = currentCol;
                            const nextCol = (currentRow + currentCol) % n;
                            currentRow = nextRow; currentCol = nextCol;
                            currentPairStr = `${currentRow},${currentCol}`;
                        }
                        sequences.push(currentSequence);
                        sequenceIndex++;
                    }
                }
            }

            // --- Calculate Colors Based on Sequence Rank ---
            const numSequences = sequences.length;
            if (numSequences > 0) {
                const sequenceInfo = sequences.map((seq, index) => ({ index, length: seq.length }));
                sequenceInfo.sort((a, b) => {
                    if (b.length !== a.length) return b.length - a.length;
                    return a.index - b.index;
                });
                const startH = 177, startS = 38, startL = 28; // #2C6360
                const endH = 0, endS = 0, endL = 85;     // Light Gray
                const deltaH = endH - startH; const deltaS = endS - startS; const deltaL = endL - startL;
                const steps = numSequences > 1 ? numSequences - 1 : 1;
                const stepH = deltaH / steps; const stepS = deltaS / steps; const stepL = deltaL / steps;

                sequenceInfo.forEach((info, rank) => {
                    const originalIndex = info.index; const sequence = sequences[originalIndex];
                    let color;
                    if (numSequences === 1) { color = 'hsl(0, 0%, 40%)'; }
                    else {
                        const H = startH + rank * stepH;
                        const S = Math.max(0, Math.min(100, startS + rank * stepS));
                        const L = Math.max(0, Math.min(100, startL + rank * stepL));
                        const finalH = (H % 360 + 360) % 360;
                        color = `hsl(${finalH}, ${S}%, ${L}%)`;
                    }
                    sequence.forEach(pair => {
                        const pairStr = `${pair[0]},${pair[1]}`;
                        cellInfo.set(pairStr, { sequenceIndex: originalIndex, color: color });
                    });
                });
            }

            // --- Create Grid Structure with Labels ---
            gridContainer.style.gridTemplateColumns = `auto repeat(${n}, minmax(25px, 1fr))`;
            gridContainer.style.gridTemplateRows = `auto repeat(${n}, minmax(25px, 1fr))`;
            const corner = document.createElement('div'); corner.className = 'label'; gridContainer.appendChild(corner);
            for (let j = 0; j < n; j++) { /* Add col labels */
                const label = document.createElement('div'); label.className = 'label col-label'; label.textContent = j; label.dataset.colIndex = j;
                gridContainer.appendChild(label); colLabels.push(label);
            }
            for (let i = 0; i < n; i++) { /* Add row labels and cells */
                const rowLabel = document.createElement('div'); rowLabel.className = 'label row-label'; rowLabel.textContent = i; rowLabel.dataset.rowIndex = i;
                gridContainer.appendChild(rowLabel); rowLabels.push(rowLabel);
                for (let j = 0; j < n; j++) {
                    const cell = document.createElement('div'); cell.className = 'grid-cell'; cell.dataset.row = i; cell.dataset.col = j;
                    const pairStr = `${i},${j}`; const info = cellInfo.get(pairStr);
                    cellElements.set(pairStr, cell); // Store cell element
                    if (info && info.color) {
                        cell.style.backgroundColor = info.color; cell.style.borderColor = 'hsl(0, 0%, 25%)';
                        const sequence = sequences[info.sequenceIndex];
                        cell.title = `Pair: (${i}, ${j})\nSequence Index: ${info.sequenceIndex}\nLength: ${sequence.length}`;
                        cell.addEventListener('click', () => handleSquareClick(i, j, info.sequenceIndex));
                    } else { /* Error case */
                        cell.style.backgroundColor = 'hsl(220, 13%, 22%)'; cell.title = `Pair: (${i}, ${j}) - Error: No sequence info`;
                        console.error(`Cell (${i}, ${j}) missing info or color.`);
                    }
                    gridContainer.appendChild(cell);
                }
            }

            sequenceDetails.textContent = `Generated grid for n=${n}. Found ${numSequences} distinct sequences. Click a square for details.`;

            // --- Attempt to restore selection ---
            if (previousSelectedPair) {
                const [prevRow, prevCol] = previousSelectedPair;
                if (prevRow < n && prevCol < n) { // Check bounds
                    const pairStr = `${prevRow},${prevCol}`; const newInfo = cellInfo.get(pairStr);
                    if (newInfo) { // Check if pair exists in new sequences
                        handleSquareClick(prevRow, prevCol, newInfo.sequenceIndex); // Simulate click
                        sequenceDetails.innerHTML += `<br/><em class='text-gray-400'>(Previous selection at (${prevRow}, ${prevCol}) restored)</em>`;
                    } else { sequenceDetails.innerHTML += `<br/><em class='text-gray-400'>(Previous selection (${prevRow}, ${prevCol}) not found in new grid sequences)</em>`; }
                } else { sequenceDetails.innerHTML += `<br/><em class='text-gray-400'>(Previous selection (${prevRow}, ${prevCol}) out of bounds for n=${n})</em>`; }
            }
        }

        // --- Interaction Logic ---

        function removeSequenceHighlight() {
            if (highlightedSequenceIndex === null || highlightedSequenceIndex >= sequences.length) return;
            const sequenceToClear = sequences[highlightedSequenceIndex];
             if (!sequenceToClear) { highlightedSequenceIndex = null; selectedPair = null; return; }
            sequenceToClear.forEach(pair => {
                const pairStr = `${pair[0]},${pair[1]}`; const cellElement = cellElements.get(pairStr); const originalInfo = cellInfo.get(pairStr);
                if (cellElement && originalInfo) { cellElement.style.backgroundColor = originalInfo.color; cellElement.style.boxShadow = ''; }
            });
            highlightedSequenceIndex = null; selectedPair = null;
        }

        function applySequenceHighlight(sequenceIndex, row, col) {
             if (sequenceIndex === null || sequenceIndex >= sequences.length) return;
             const sequenceToHighlight = sequences[sequenceIndex];
             if (!sequenceToHighlight) return;
            const highlightColorStyle = '#FFBF00';
            sequenceToHighlight.forEach(pair => {
                const pairStr = `${pair[0]},${pair[1]}`; const cellElement = cellElements.get(pairStr);
                if (cellElement) { cellElement.style.backgroundColor = highlightColorStyle; cellElement.style.boxShadow = `inset 0 0 0 2px ${highlightColorStyle}`; }
            });
            highlightedSequenceIndex = sequenceIndex; selectedPair = [row, col];
        }

        function handleSquareClick(row, col, sequenceIndex) {
             if (sequenceIndex === undefined || sequenceIndex >= sequences.length) {
                 console.error("Invalid sequence index on click:", sequenceIndex);
                 sequenceDetails.innerHTML = `<strong style="color: #f87171;">Error:</strong> Error retrieving sequence for square (${row}, ${col}).`;
                 return;
            }
            const previouslyHighlightedIndex = highlightedSequenceIndex;
            removeSequenceHighlight(); // Clear previous highlight and selectedPair state

            // Apply highlight only if it wasn't the one already highlighted (toggle-off)
            if (previouslyHighlightedIndex !== sequenceIndex) {
                 applySequenceHighlight(sequenceIndex, row, col); // This sets highlightedSequenceIndex and selectedPair
            }

            // --- Details Display ---
            if (highlightedSequenceIndex !== null) { // Check if a sequence is now highlighted
                const sequence = sequences[highlightedSequenceIndex]; // Use the currently highlighted index
                const totalCells = currentModulus * currentModulus;
                const percentage = totalCells > 0 ? (sequence.length / totalCells) * 100 : 0;
                const maxDisplayLength = 100; // Limit displayed sequence length

                // --- Reorder sequence for display starting from clicked cell ---
                let displaySequence = sequence; // Default to original order
                const startIndex = sequence.findIndex(pair => pair[0] === row && pair[1] === col);
                if (startIndex !== -1) {
                    const part1 = sequence.slice(startIndex);
                    const part2 = sequence.slice(0, startIndex);
                    displaySequence = part1.concat(part2);
                }
                // --- End of reordering ---

                let sequenceString = displaySequence.map(pair => `(${pair[0]},${pair[1]})`).slice(0, maxDisplayLength).join(' → ');
                if (sequence.length > maxDisplayLength) {
                    sequenceString += ` → ... (Total ${sequence.length} pairs)`;
                }
                const highlightColor = '#5eead4';
                sequenceDetails.innerHTML = `
                    <strong style="color: ${highlightColor};">Pair:</strong> (${row}, ${col})<br>
                    <strong style="color: ${highlightColor};">Grid Coverage:</strong> ${percentage.toFixed(2)}%<br>
                    <strong style="color: ${highlightColor};">Sequence Length:</strong> ${sequence.length}<br>
                    <strong style="color: ${highlightColor};">Sequence:</strong> ${sequenceString}
                `;
            } else { // If highlight was toggled off
                 sequenceDetails.textContent = `Generated grid for n=${currentModulus}. Found ${sequences.length} distinct sequences. Click a square for details.`;
            }

            // --- Label Highlighting ---
            colLabels.forEach(lbl => lbl.classList.remove('highlight-label'));
            rowLabels.forEach(lbl => lbl.classList.remove('highlight-label'));
            if (highlightedSequenceIndex !== null) { // Only highlight labels if selected
                if (colLabels[col]) colLabels[col].classList.add('highlight-label');
                if (rowLabels[row]) rowLabels[row].classList.add('highlight-label');
            }
        }

        // --- Event Listeners ---
        modulusInput.addEventListener('input', debounce(generateGrid, 400));

        // Generate initial grid on load
        generateGrid();

    </script>

</body>
</html>

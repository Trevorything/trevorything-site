<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo Matrix – Trevorything.ai</title>
    <meta name="description" content="Explore modular arithmetic visually with the Modulo Matrix. Click cells to reveal sum sequences and cyclic patterns.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ─── Design Tokens ─── */
        :root {
            --darkest: #041c1c;
            --dark: #0a2e2e;
            --mid-dark: #0f4040;
            --teal: #1a5c5c;
            --mid: #267a7a;
            --mid-light: #3d9e9e;
            --light: #5ec2c2;
            --lighter: #8fd8d8;
            --lightest: #c2eded;
            --white: #f0fafa;
            --amber: #FFBF00;
            --error: #f87171;
        }

        /* ─── Reset & Base ─── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--mid-dark);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }

        /* ─── Header / Nav ─── */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            position: relative;
            z-index: 50;
        }

        .back-link {
            color: var(--lighter);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.01em;
            transition: color 0.2s;
            white-space: nowrap;
        }
        .back-link:hover { color: var(--white); }

        .page-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .dot-nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .dot-nav a {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: block;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .dot-nav a:hover {
            transform: scale(1.35);
        }
        .dot-nav a::after {
            content: attr(aria-label);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--darkest);
            color: var(--lightest);
            font-size: 11px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s;
        }
        .dot-nav a:hover::after { opacity: 1; }

        .dot-pisano   { background: var(--mid-light); box-shadow: 0 0 6px var(--mid-light); }
        .dot-matrix    { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
        .dot-webs      { background: #FEFF00; box-shadow: 0 0 6px #FEFF00; }
        .dot-moons     { background: #818cf8; box-shadow: 0 0 6px #818cf8; }

        /* ─── Wave Divider ─── */
        .wave-divider {
            width: 100%;
            overflow: hidden;
            line-height: 0;
        }
        .wave-divider svg {
            display: block;
            width: 100%;
            height: 36px;
        }

        /* ─── Main Content ─── */
        .main-content {
            flex: 1;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 48px;
        }

        /* ─── Controls Card (glassmorphic) ─── */
        .controls-card {
            background: rgba(10, 46, 46, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px 32px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.25);
        }

        .controls-card label {
            font-size: 14px;
            font-weight: 500;
            color: var(--lightest);
        }

        .controls-card input[type="number"] {
            width: 80px;
            text-align: center;
            padding: 10px 14px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            color: var(--white);
            background: var(--dark);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: textfield;
            -moz-appearance: textfield;
        }
        .controls-card input[type="number"]::-webkit-inner-spin-button,
        .controls-card input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .controls-card input[type="number"]:focus {
            border-color: var(--mid-light);
            box-shadow: 0 0 0 3px rgba(61, 158, 158, 0.35);
        }

        /* ─── Sequence Details (glassmorphic) ─── */
        #sequenceDetails {
            min-height: 4.5em;
            background: rgba(10, 46, 46, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px 24px;
            margin-bottom: 24px;
            text-align: center;
            font-size: 13px;
            line-height: 1.7;
            color: var(--lightest);
            word-break: break-all;
            box-shadow: 0 2px 20px rgba(0,0,0,0.18);
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .highlight-text {
            color: var(--lighter);
            font-weight: 600;
        }

        .arrow-sep {
            color: var(--teal);
        }

        .error-text {
            color: var(--error);
            font-weight: 600;
        }

        .restore-note {
            color: var(--mid);
            font-style: italic;
        }

        /* ─── Grid Container ─── */
        .grid-wrapper {
            display: flex;
            justify-content: center;
        }

        #gridContainer {
            display: grid;
            gap: 2px;
            background-color: var(--dark);
            padding: 8px;
            border-radius: 12px;
            overflow: auto;
            max-width: 90vw;
            max-height: 75vh;
            margin: auto;
            box-shadow: 0 8px 40px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        /* ─── Grid Cells ─── */
        .grid-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background-color 0.2s ease-in-out, transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .grid-cell:hover {
            outline: 2px solid var(--mid-light);
            outline-offset: 1px;
            transform: scale(1.12);
            z-index: 10;
            box-shadow: 0 0 12px rgba(61, 158, 158, 0.4);
        }

        .highlight-sequence {
            box-shadow: inset 0 0 0 2px var(--amber);
        }

        /* ─── Labels ─── */
        .label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            min-width: 2.5rem;
            min-height: 2.5rem;
            padding: 4px;
            background-color: var(--darkest);
            color: var(--lightest);
            user-select: none;
        }

        .highlight-label {
            background-color: var(--teal);
            color: var(--white);
            font-weight: 700;
        }

        /* ─── Wave Divider (Footer) ─── */
        .wave-divider-footer {
            width: 100%;
            overflow: hidden;
            line-height: 0;
            margin-top: auto;
        }
        .wave-divider-footer svg {
            display: block;
            width: 100%;
            height: 32px;
        }

        /* ─── Footer ─── */
        .site-footer {
            text-align: center;
            padding: 20px 16px;
            font-size: 13px;
            color: var(--lighter);
            background: var(--darkest);
            letter-spacing: 0.01em;
        }

        /* ─── Responsive ─── */
        @media (max-width: 600px) {
            .page-title {
                font-size: 20px;
            }
            .site-header {
                padding: 12px 16px;
            }
            .controls-card {
                padding: 18px 20px;
            }
            #sequenceDetails {
                font-size: 12px;
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ── Header ── -->
    <header class="site-header">
        <a href="../index.html" class="back-link">← Trevorything.ai</a>
        <h1 class="page-title">Modulo Matrix</h1>
        <nav class="dot-nav" aria-label="Tool navigation">
            <a href="../Sum Sequence Path/index.html" class="dot-pisano" aria-label="Pisano Paths"></a>
            <a href="index.html" class="dot-matrix" aria-label="Modulo Matrix"></a>
            <a href="../Pisano Webs/index.html" class="dot-webs" aria-label="Yatsko's Webs"></a>
            <a href="../howmanymoons/index.html" class="dot-moons" aria-label="How Many Moons"></a>
        </nav>
    </header>

    <!-- ── Wave ── -->
    <div class="wave-divider">
        <svg viewBox="0 0 1200 36" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 36 C300 0 900 0 1200 36 L1200 36 L0 36Z" fill="var(--dark)" opacity="0.35"/>
            <path d="M0 36 C400 8 800 8 1200 36 L1200 36 L0 36Z" fill="var(--dark)" opacity="0.55"/>
        </svg>
    </div>

    <!-- ── Main ── -->
    <main class="main-content">

        <!-- Controls -->
        <div class="controls-card">
            <label for="modulusInput">Modulus (n)</label>
            <input type="number" id="modulusInput" min="2" max="50" value="10">
        </div>

        <!-- Sequence Details -->
        <div id="sequenceDetails">
            Enter a modulus (2–50). Grid will generate automatically. Click a square for details.
        </div>

        <!-- Wave between controls and grid -->
        <div class="wave-divider" style="margin-bottom:16px;">
            <svg viewBox="0 0 1200 28" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 0 C300 28 900 28 1200 0 L1200 28 L0 28Z" fill="var(--dark)" opacity="0.3"/>
            </svg>
        </div>

        <!-- Grid -->
        <div class="grid-wrapper">
            <div id="gridContainer"></div>
        </div>

    </main>

    <!-- ── Wave Footer ── -->
    <div class="wave-divider-footer">
        <svg viewBox="0 0 1200 32" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 0 C300 32 900 32 1200 0 L1200 32 L0 32Z" fill="var(--darkest)"/>
        </svg>
    </div>

    <!-- ── Footer ── -->
    <footer class="site-footer">
        <p>&copy; 2026 Trevorything.ai</p>
    </footer>

    <!-- ═══════════════════════════════════════════ -->
    <!--  JavaScript — All logic preserved intact    -->
    <!-- ═══════════════════════════════════════════ -->
    <script>
        // DOM Elements
        const modulusInput = document.getElementById('modulusInput');
        const gridContainer = document.getElementById('gridContainer');
        const sequenceDetails = document.getElementById('sequenceDetails');

        // Global state
        let sequences = [];
        let cellInfo = new Map(); // Stores { sequenceIndex, color } for each "row,col"
        let cellElements = new Map(); // Stores DOM element for each "row,col"
        let currentModulus = 0;
        let colLabels = [];
        let rowLabels = [];
        let debounceTimer;
        let highlightedSequenceIndex = null; // Track the currently highlighted sequence index
        let selectedPair = null; // Track the coordinates [row, col] of the selected cell

        // --- Debounce Function ---
        function debounce(func, delay) {
            return function(...args) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    func.apply(this, args);
                }, delay);
            };
        }

        // --- Grid Generation Logic ---
        function generateGrid() {
            clearTimeout(debounceTimer);
            const previousSelectedPair = selectedPair;
            selectedPair = null;
            highlightedSequenceIndex = null;

            const n = parseInt(modulusInput.value);
            if (isNaN(n) || n < 2 || n > 50) {
                sequenceDetails.innerHTML = `<strong class="error-text">Error:</strong> Please enter a valid modulus (n) between 2 and 50.`;
                gridContainer.innerHTML = '';
                sequences = []; cellInfo.clear(); cellElements.clear(); currentModulus = 0;
                return;
            }

            // Prevent unnecessary regeneration
            if (n === currentModulus && sequences.length > 0) {
                selectedPair = previousSelectedPair; // Restore selection state
                if(selectedPair) {
                    const pairStr = `${selectedPair[0]},${selectedPair[1]}`;
                    const info = cellInfo.get(pairStr);
                    if(info) highlightedSequenceIndex = info.sequenceIndex;
                }
                sequenceDetails.textContent = `Grid for n=${n} already shown. Click a square for details.`;
                // Restore highlight and details if a pair was selected
                if(selectedPair && highlightedSequenceIndex !== null) {
                     handleSquareClick(selectedPair[0], selectedPair[1], highlightedSequenceIndex);
                }
                return;
            }

            currentModulus = n;
            gridContainer.innerHTML = '';
            sequenceDetails.textContent = 'Generating... Please wait.';
            sequences = []; cellInfo.clear(); cellElements.clear(); colLabels = []; rowLabels = [];
            const visited = new Set();

            // --- Find all sequences/cycles ---
            let tempCellInfo = new Map();
            let sequenceIndex = 0;
            for (let startRow = 0; startRow < n; startRow++) {
                for (let startCol = 0; startCol < n; startCol++) {
                    const startPairStr = `${startRow},${startCol}`;
                    if (!visited.has(startPairStr)) {
                        const currentSequence = [];
                        let currentRow = startRow; let currentCol = startCol;
                        let currentPairStr = `${currentRow},${currentCol}`;
                        while (!visited.has(currentPairStr)) {
                            visited.add(currentPairStr);
                            currentSequence.push([currentRow, currentCol]);
                            tempCellInfo.set(currentPairStr, { sequenceIndex });
                            const nextRow = currentCol;
                            const nextCol = (currentRow + currentCol) % n;
                            currentRow = nextRow; currentCol = nextCol;
                            currentPairStr = `${currentRow},${currentCol}`;
                        }
                        sequences.push(currentSequence);
                        sequenceIndex++;
                    }
                }
            }

            // --- Calculate Colors Based on Sequence Rank ---
            const numSequences = sequences.length;
            if (numSequences > 0) {
                const sequenceInfo = sequences.map((seq, index) => ({ index, length: seq.length }));
                sequenceInfo.sort((a, b) => {
                    if (b.length !== a.length) return b.length - a.length;
                    return a.index - b.index;
                });
                // Teal-based gradient: dark teal → medium teal
                const startH = 175, startS = 45, startL = 12; // Very dark teal for longest
                const endH = 175, endS = 25, endL = 55;       // Medium teal for shortest
                const deltaH = endH - startH; const deltaS = endS - startS; const deltaL = endL - startL;
                const steps = numSequences > 1 ? numSequences - 1 : 1;
                const stepH = deltaH / steps; const stepS = deltaS / steps; const stepL = deltaL / steps;

                sequenceInfo.forEach((info, rank) => {
                    const originalIndex = info.index; const sequence = sequences[originalIndex];
                    let color;
                    if (numSequences === 1) { color = 'hsl(175, 30%, 32%)'; } // Mid-teal for single sequence
                    else {
                        const H = startH + rank * stepH;
                        const S = Math.max(0, Math.min(100, startS + rank * stepS));
                        const L = Math.max(0, Math.min(100, startL + rank * stepL));
                        const finalH = (H % 360 + 360) % 360;
                        color = `hsl(${finalH}, ${S}%, ${L}%)`;
                    }
                    sequence.forEach(pair => {
                        const pairStr = `${pair[0]},${pair[1]}`;
                        cellInfo.set(pairStr, { sequenceIndex: originalIndex, color: color });
                    });
                });
            }

            // --- Create Grid Structure with Labels ---
            gridContainer.style.gridTemplateColumns = `auto repeat(${n}, minmax(25px, 1fr))`;
            gridContainer.style.gridTemplateRows = `auto repeat(${n}, minmax(25px, 1fr))`;
            const corner = document.createElement('div'); corner.className = 'label'; gridContainer.appendChild(corner);
            for (let j = 0; j < n; j++) { /* Add col labels */
                const label = document.createElement('div'); label.className = 'label col-label'; label.textContent = j; label.dataset.colIndex = j;
                gridContainer.appendChild(label); colLabels.push(label);
            }
            for (let i = 0; i < n; i++) { /* Add row labels and cells */
                const rowLabel = document.createElement('div'); rowLabel.className = 'label row-label'; rowLabel.textContent = i; rowLabel.dataset.rowIndex = i;
                gridContainer.appendChild(rowLabel); rowLabels.push(rowLabel);
                for (let j = 0; j < n; j++) {
                    const cell = document.createElement('div'); cell.className = 'grid-cell'; cell.dataset.row = i; cell.dataset.col = j;
                    const pairStr = `${i},${j}`; const info = cellInfo.get(pairStr);
                    cellElements.set(pairStr, cell); // Store cell element
                    if (info && info.color) {
                        cell.style.backgroundColor = info.color;
                        cell.style.borderColor = 'rgba(255,255,255,0.05)';
                        const sequence = sequences[info.sequenceIndex];
                        cell.title = `Pair: (${i}, ${j})\nSequence Index: ${info.sequenceIndex}\nLength: ${sequence.length}`;
                        cell.addEventListener('click', () => handleSquareClick(i, j, info.sequenceIndex));
                    } else { /* Error case */
                        cell.style.backgroundColor = 'hsl(175, 20%, 15%)'; cell.title = `Pair: (${i}, ${j}) - Error: No sequence info`;
                        console.error(`Cell (${i}, ${j}) missing info or color.`);
                    }
                    gridContainer.appendChild(cell);
                }
            }

            sequenceDetails.textContent = `Generated grid for n=${n}. Found ${numSequences} distinct sequences. Click a square for details.`;

            // --- Attempt to restore selection ---
            if (previousSelectedPair) {
                const [prevRow, prevCol] = previousSelectedPair;
                if (prevRow < n && prevCol < n) { // Check bounds
                    const pairStr = `${prevRow},${prevCol}`; const newInfo = cellInfo.get(pairStr);
                    if (newInfo) { // Check if pair exists in new sequences
                        handleSquareClick(prevRow, prevCol, newInfo.sequenceIndex); // Simulate click
                        sequenceDetails.innerHTML += `<br/><em class='restore-note'>(Previous selection at (${prevRow}, ${prevCol}) restored)</em>`;
                    } else { sequenceDetails.innerHTML += `<br/><em class='restore-note'>(Previous selection (${prevRow}, ${prevCol}) not found in new grid sequences)</em>`; }
                } else { sequenceDetails.innerHTML += `<br/><em class='restore-note'>(Previous selection (${prevRow}, ${prevCol}) out of bounds for n=${n})</em>`; }
            }
        }

        // --- Interaction Logic ---

        function removeSequenceHighlight() {
            if (highlightedSequenceIndex === null || highlightedSequenceIndex >= sequences.length) return;
            const sequenceToClear = sequences[highlightedSequenceIndex];
             if (!sequenceToClear) { highlightedSequenceIndex = null; selectedPair = null; return; }
            sequenceToClear.forEach(pair => {
                const pairStr = `${pair[0]},${pair[1]}`; const cellElement = cellElements.get(pairStr); const originalInfo = cellInfo.get(pairStr);
                if (cellElement && originalInfo) {
                    cellElement.style.backgroundColor = originalInfo.color;
                    cellElement.style.boxShadow = ''; // Remove highlight shadow
                    cellElement.classList.remove('highlight-sequence'); // Remove class if used
                }
            });
            highlightedSequenceIndex = null; selectedPair = null;
        }

        function applySequenceHighlight(sequenceIndex, row, col) {
             if (sequenceIndex === null || sequenceIndex >= sequences.length) return;
             const sequenceToHighlight = sequences[sequenceIndex];
             if (!sequenceToHighlight) return;
            const highlightColorStyle = '#FFBF00'; // Amber/Gold highlight color
            sequenceToHighlight.forEach(pair => {
                const pairStr = `${pair[0]},${pair[1]}`; const cellElement = cellElements.get(pairStr);
                if (cellElement) {
                     // Keep background color for the highlighted sequence
                    cellElement.style.backgroundColor = highlightColorStyle;
                    // Add border/shadow effect using class defined in CSS
                    cellElement.classList.add('highlight-sequence');
                }
            });
            highlightedSequenceIndex = sequenceIndex; selectedPair = [row, col];
        }

        function handleSquareClick(row, col, sequenceIndex) {
             if (sequenceIndex === undefined || sequenceIndex >= sequences.length) {
                 console.error("Invalid sequence index on click:", sequenceIndex);
                 sequenceDetails.innerHTML = `<strong class="error-text">Error:</strong> Error retrieving sequence for square (${row}, ${col}).`;
                 return;
             }
             const previouslyHighlightedIndex = highlightedSequenceIndex;
             const wasSameCellClicked = selectedPair && selectedPair[0] === row && selectedPair[1] === col;

             removeSequenceHighlight(); // Clear previous highlight and selectedPair state

             // Apply highlight only if clicking a *different* sequence or re-clicking the same cell to toggle back on
             if (previouslyHighlightedIndex !== sequenceIndex || !wasSameCellClicked || previouslyHighlightedIndex === null) {
                  applySequenceHighlight(sequenceIndex, row, col); // This sets highlightedSequenceIndex and selectedPair
             }
             // If the same cell was clicked and it *was* highlighted, removeSequenceHighlight() already handled toggling off.


             // --- Details Display ---
             if (highlightedSequenceIndex !== null) { // Check if a sequence is now highlighted
                 const sequence = sequences[highlightedSequenceIndex]; // Use the currently highlighted index
                 const totalCells = currentModulus * currentModulus;
                 const percentage = totalCells > 0 ? (sequence.length / totalCells) * 100 : 0;
                 const maxDisplayLength = 100; // Limit displayed sequence length

                 // --- Reorder sequence for display starting from clicked cell ---
                 let displaySequence = sequence; // Default to original order
                 const startIndex = sequence.findIndex(pair => pair[0] === row && pair[1] === col);
                 if (startIndex !== -1) {
                     const part1 = sequence.slice(startIndex);
                     const part2 = sequence.slice(0, startIndex);
                     displaySequence = part1.concat(part2);
                 }
                 // --- End of reordering ---

                 let sequenceString = displaySequence.map(pair => `(${pair[0]},${pair[1]})`).slice(0, maxDisplayLength).join(' <span class="arrow-sep">→</span> ');
                 if (sequence.length > maxDisplayLength) {
                     sequenceString += ` <span class="arrow-sep">→</span> ... (Total ${sequence.length} pairs)`;
                 }

                 // Use CSS classes for highlighting text
                 sequenceDetails.innerHTML = `
                     <strong class="highlight-text">Pair:</strong> (${row}, ${col})<br>
                     <strong class="highlight-text">Grid Coverage:</strong> ${percentage.toFixed(2)}%<br>
                     <strong class="highlight-text">Sequence Length:</strong> ${sequence.length}<br>
                     <strong class="highlight-text">Sequence:</strong> ${sequenceString}
                 `;
             } else { // If highlight was toggled off
                  sequenceDetails.textContent = `Generated grid for n=${currentModulus}. Found ${sequences.length} distinct sequences. Click a square for details.`;
             }

             // --- Label Highlighting ---
             colLabels.forEach(lbl => lbl.classList.remove('highlight-label'));
             rowLabels.forEach(lbl => lbl.classList.remove('highlight-label'));
             if (highlightedSequenceIndex !== null) { // Only highlight labels if selected
                 if (colLabels[col]) colLabels[col].classList.add('highlight-label');
                 if (rowLabels[row]) rowLabels[row].classList.add('highlight-label');
             }
        }

        // --- Event Listeners ---
        modulusInput.addEventListener('input', debounce(generateGrid, 400));

        // --- Initial Load ---
        window.addEventListener('load', () => {
            generateGrid(); // Generate initial grid
        });

    </script>

</body>

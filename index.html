<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trevorything.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Dark background */
            color: #f3f4f6; /* Light text */
            overflow-x: hidden; /* Prevent horizontal scroll */
            margin: 0;
            padding: 0;
        }

        /* Preview Tab Animation */
        .preview-tab {
            position: absolute;
            transition: all 0.5s ease-in-out;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .preview-tab:hover {
            z-index: 20;
            transform: scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }

        /* Active/Playing State */
        .preview-tab.active-tab {
            z-index: 30;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        /* Iframe styling for previews */
        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Let clicks pass through to the tab container */
            transform: scale(0.5); /* Initial zoomed out look */
            transform-origin: center center;
            transition: transform 0.5s ease-in-out;
            opacity: 0.6;
        }

        .preview-tab:hover .preview-frame,
        .preview-tab.active-tab .preview-frame {
            transform: scale(0.75); /* Zoom in a bit on hover/active */
            opacity: 1;
        }

        /* Overlay for title and CTA */
        .tab-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-col;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
            pointer-events: none;
        }

        .preview-tab:hover .tab-overlay,
        .preview-tab.active-tab .tab-overlay {
            background: rgba(0, 0, 0, 0.1);
        }

        .tab-title {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 0.5rem;
            text-align: center;
            padding: 0 10px;
        }

        .tab-desc {
            font-size: 1rem;
            color: #e5e7eb;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 80%;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .preview-tab:hover .tab-desc,
        .preview-tab.active-tab .tab-desc {
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <header class="py-4 px-4 md:px-8 bg-gray-800 shadow-md rounded-b-lg mb-8 flex flex-col md:flex-row justify-between items-center z-50 relative">
        <h1 class="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 pb-1 mb-4 md:mb-0 md:mr-4">
            Trevorything.ai
        </h1>
        <nav class="flex space-x-4">
             <a href="Sum Sequence Path/index.html" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 ease-in-out shadow hover:shadow-md">
                 Pisano Paths
             </a>
             <a href="Sum Sequence Matrix/index.html" class="bg-pink-600 hover:bg-pink-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 ease-in-out shadow hover:shadow-md">
                 Modulo Matrix
             </a>
             <a href="Pisano Webs/index.html" class="bg-[#FEFF00] hover:bg-yellow-300 text-black font-semibold py-2 px-4 rounded-lg transition duration-200 ease-in-out shadow hover:shadow-md">
                 Yatsko's Webs
             </a>
        </nav>
    </header>

    <main class="flex-grow relative w-full h-[80vh] overflow-hidden flex flex-col justify-center items-center">

        <!-- Tab 1: Pisano Paths (Left) -->
        <div class="preview-tab" id="tab1" onclick="window.location.href='Sum Sequence Path/index.html'"
             style="top: 5%; left: -5%; width: 60%; height: 35%; background-color: #1f2937; transform: skewX(-10deg);">
            <div style="transform: skewX(10deg); width: 100%; height: 100%; position: relative;">
                <iframe src="Sum Sequence Path/preview.html" class="preview-frame" scrolling="no"></iframe>
                <div class="tab-overlay">
                    <h2 class="tab-title">Pisano Paths</h2>
                    <p class="tab-desc">Explore the paths of sum sequences.</p>
                </div>
            </div>
        </div>

        <!-- Tab 2: Modulo Matrix (Right) -->
        <div class="preview-tab" id="tab2" onclick="window.location.href='Sum Sequence Matrix/index.html'"
             style="top: 35%; right: -5%; width: 60%; height: 35%; background-color: #374151; transform: skewX(10deg);">
            <div style="transform: skewX(-10deg); width: 100%; height: 100%; position: relative;">
                 <iframe src="Sum Sequence Matrix/preview.html" class="preview-frame" scrolling="no"></iframe>
                 <div class="tab-overlay">
                    <h2 class="tab-title">Modulo Matrix</h2>
                    <p class="tab-desc">Visualize sequences in a matrix grid.</p>
                </div>
            </div>
        </div>

        <!-- Tab 3: Yatsko's Webs (Left) -->
        <div class="preview-tab" id="tab3" onclick="window.location.href='Pisano Webs/index.html'"
             style="top: 65%; left: -5%; width: 60%; height: 35%; background-color: #4b5563; transform: skewX(-10deg);">
            <div style="transform: skewX(10deg); width: 100%; height: 100%; position: relative;">
                <iframe src="Pisano Webs/preview.html" class="preview-frame" scrolling="no"></iframe>
                <div class="tab-overlay">
                    <h2 class="tab-title">Yatsko's Webs</h2>
                    <p class="tab-desc">Beautiful circular visualizations of Pisano periods.</p>
                </div>
            </div>
        </div>

    </main>

    <footer class="mt-4 py-6 px-4 text-center text-gray-400 border-t border-gray-700 bg-gray-800 z-50">
        <p>&copy; <span id="currentYear"></span> Trevorything.ai. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.preview-tab');
            let currentActive = 0;
            const cycleInterval = 4000; // Change active tab every 4 seconds
            let intervalId;

            function setActiveTab(index) {
                tabs.forEach((tab, i) => {
                    if (i === index) {
                        tab.classList.add('active-tab');
                        // Bring to front slightly
                        tab.style.zIndex = '30';
                    } else {
                        tab.classList.remove('active-tab');
                        tab.style.zIndex = '10';
                    }
                });
            }

            // Initial Active
            setActiveTab(currentActive);

            // Auto-play animation (cycling active state)
            function startCycle() {
                intervalId = setInterval(() => {
                    currentActive = (currentActive + 1) % tabs.length;
                    setActiveTab(currentActive);
                }, cycleInterval);
            }

            function stopCycle() {
                clearInterval(intervalId);
            }

            startCycle();

            // Hover interactions
            tabs.forEach((tab, index) => {
                tab.addEventListener('mouseenter', () => {
                    stopCycle();
                    setActiveTab(index);
                    currentActive = index;
                });

                tab.addEventListener('mouseleave', () => {
                   startCycle();
                });
            });

            // Update footer year
            const currentYearElement = document.getElementById('currentYear');
            if (currentYearElement) {
                currentYearElement.textContent = new Date().getFullYear();
            }
        });
    </script>

</body>
</html>

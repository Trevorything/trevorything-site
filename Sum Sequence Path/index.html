<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisano Paths — Trevorything.ai</title>
    <meta name="description" content="Visualize Pisano period paths generated by modular Fibonacci-like sum sequences. Explore cyclic patterns and geometric symmetry.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== Design Tokens ===== */
        :root {
            --darkest: #041c1c;
            --dark: #0a2e2e;
            --mid-dark: #0f4040;
            --teal: #1a5c5c;
            --mid: #267a7a;
            --mid-light: #3d9e9e;
            --light: #5ec2c2;
            --lighter: #8fd8d8;
            --lightest: #c2eded;
            --white: #f0fafa;

            --glass-bg: rgba(10, 46, 46, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-hover: rgba(255, 255, 255, 0.18);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
        }

        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--darkest);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== Header / Nav ===== */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            position: relative;
            z-index: 10;
        }

        .back-link {
            color: var(--lighter);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.01em;
            transition: color var(--transition);
            white-space: nowrap;
        }
        .back-link:hover { color: var(--white); }

        .page-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: -0.02em;
        }

        .dot-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .dot-nav a {
            display: block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--mid-light);
            transition: background var(--transition), transform var(--transition);
        }
        .dot-nav a:hover {
            background: var(--light);
            transform: scale(1.25);
        }

        /* ===== Topographical Wave Dividers ===== */
        .wave-divider {
            display: block;
            width: 100%;
            height: auto;
            line-height: 0;
        }
        .wave-divider svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ===== Main Content ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 16px;
        }

        /* ===== Canvas Area ===== */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: var(--darkest);
            border-radius: var(--radius);
        }

        /* Info cards overlaid on canvas */
        .info-card {
            position: absolute;
            bottom: 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--white);
            font-size: 12px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            line-height: 1.5;
            pointer-events: none;
        }
        .info-card--left  { left: 12px; }
        .info-card--right { right: 12px; }

        /* ===== Controls Panel ===== */
        .controls-panel {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 24px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            align-items: end;
        }

        .control-group { display: flex; flex-direction: column; gap: 6px; }

        .control-group-pair {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-group-pair .pair-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--lighter);
            text-align: center;
        }
        .pair-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            font-size: 12px;
            font-weight: 500;
            color: var(--lighter);
        }

        input[type="number"] {
            appearance: textfield;
            -moz-appearance: textfield;
            width: 100%;
            padding: 10px 14px;
            background: var(--mid-dark);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        input[type="number"]:focus {
            border-color: var(--mid-light);
            box-shadow: 0 0 0 3px rgba(61, 158, 158, 0.25);
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .error-message {
            text-align: center;
            font-size: 13px;
            color: #f0928b;
            min-height: 20px;
            margin-top: 12px;
        }

        /* ===== Footer ===== */
        .site-footer {
            text-align: center;
            padding: 20px 16px 24px;
            color: var(--lighter);
            font-size: 13px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .page-title { font-size: 22px; }
            .controls-grid {
                grid-template-columns: 1fr;
            }
            .controls-panel { padding: 18px; }
            .site-header { padding: 12px 16px; }
        }
    </style>
</head>
<body>

    <!-- ===== Header ===== -->
    <header class="site-header" id="site-header">
        <a href="../index.html" class="back-link" id="back-link">← Trevorything.ai</a>
        <h1 class="page-title" id="page-title">Pisano Paths</h1>
        <nav class="dot-nav" id="dot-nav" aria-label="Other visualizers">
            <a href="../Sum Sequence Matrix/index.html" title="Modulo Matrix" id="nav-dot-matrix"></a>
            <a href="../Pisano Webs/index.html" title="Yatsko's Webs" id="nav-dot-webs"></a>
            <a href="../howmanymoons/index.html" title="How Many Moons" id="nav-dot-moons"></a>
        </nav>
    </header>

    <!-- Wave: Header → Canvas -->
    <div class="wave-divider" aria-hidden="true">
        <svg viewBox="0 0 1440 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,40 C120,20 240,55 360,35 C480,15 600,50 720,30 C840,10 960,45 1080,25 C1200,5 1320,40 1440,20 L1440,60 L0,60 Z" fill="#041c1c"/>
            <path d="M0,48 C180,30 360,58 540,38 C720,18 900,52 1080,32 C1260,12 1350,45 1440,30 L1440,60 L0,60 Z" fill="rgba(10,46,46,0.4)"/>
        </svg>
    </div>

    <!-- ===== Main ===== -->
    <main class="main-content" id="main-content">

        <!-- Canvas Visualization -->
        <div class="canvas-wrapper" id="canvas-wrapper">
            <canvas id="pathCanvas" width="600" height="600"></canvas>
            <div class="info-card info-card--left" id="sequenceInfoCard">Loading...</div>
            <div class="info-card info-card--right" id="pathInfoCard">Loading...</div>
        </div>

        <!-- Wave: Canvas → Controls -->
        <div class="wave-divider" aria-hidden="true" style="max-width:600px;width:100%;margin:0 auto;">
            <svg viewBox="0 0 600 24" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0,12 C75,4 150,20 225,10 C300,0 375,18 450,8 C525,0 562,16 600,10 L600,24 L0,24 Z" fill="rgba(10,46,46,0.35)"/>
            </svg>
        </div>

        <!-- Controls Panel -->
        <div class="controls-panel" id="controls-panel">
            <div class="controls-grid">

                <!-- Starting Pair -->
                <div class="control-group-pair">
                    <span class="pair-label">Starting Pair</span>
                    <div class="pair-inputs">
                        <div class="control-group">
                            <label for="x1Input">x₁</label>
                            <input type="number" id="x1Input" value="1">
                        </div>
                        <div class="control-group">
                            <label for="x2Input">x₂</label>
                            <input type="number" id="x2Input" value="1">
                        </div>
                    </div>
                </div>

                <!-- Modulus -->
                <div class="control-group">
                    <label for="modInput">Modulus (m)</label>
                    <input type="number" id="modInput" value="10" min="1">
                </div>

                <!-- Directions -->
                <div class="control-group">
                    <label for="sidesInput">Directions</label>
                    <input type="number" id="sidesInput" value="4" min="1">
                </div>

            </div>
            <p class="error-message" id="error-message"></p>
        </div>

    </main>

    <!-- Wave: Content → Footer -->
    <div class="wave-divider" aria-hidden="true">
        <svg viewBox="0 0 1440 48" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,30 C180,10 360,40 540,20 C720,0 900,35 1080,15 C1260,0 1380,28 1440,18 L1440,48 L0,48 Z" fill="rgba(10,46,46,0.3)"/>
            <path d="M0,38 C200,22 400,44 600,28 C800,12 1000,40 1200,24 C1350,12 1410,34 1440,26 L1440,48 L0,48 Z" fill="rgba(15,64,64,0.2)"/>
        </svg>
    </div>

    <!-- ===== Footer ===== -->
    <footer class="site-footer" id="site-footer">
        <p>&copy; 2026 Trevorything.ai</p>
    </footer>

    <!-- ===== JavaScript ===== -->
    <script>
        // --- Get DOM Elements ---
        const modInput = document.getElementById('modInput');
        const x1Input = document.getElementById('x1Input');
        const x2Input = document.getElementById('x2Input');
        const sidesInput = document.getElementById('sidesInput');
        const canvas = document.getElementById('pathCanvas');
        const ctx = canvas.getContext('2d');
        const errorMessage = document.getElementById('error-message');
        const sequenceInfoCard = document.getElementById('sequenceInfoCard');
        const pathInfoCard = document.getElementById('pathInfoCard');


        // --- Configuration ---
        const SEQUENCE_LENGTH = 5000; // Fixed sequence length
        const ORIGIN_THRESHOLD = 1e-6; // Threshold for checking path return to origin

        // --- White-to-Teal Gradient Color Stops ---
        const GRADIENT_STOPS = [
            { pos: 0.00, r: 240, g: 250, b: 250 }, // --white  #f0fafa
            { pos: 0.25, r: 194, g: 237, b: 237 }, // --lightest #c2eded
            { pos: 0.50, r: 143, g: 216, b: 216 }, // --lighter  #8fd8d8
            { pos: 0.75, r: 94,  g: 194, b: 194 }, // --light    #5ec2c2
            { pos: 1.00, r: 26,  g: 92,  b: 92  }  // --teal     #1a5c5c
        ];

        /**
         * Interpolates a color from the GRADIENT_STOPS array for a given t ∈ [0,1].
         */
        function getGradientColor(t) {
            t = Math.max(0, Math.min(1, t));
            // Find the two surrounding stops
            let lower = GRADIENT_STOPS[0];
            let upper = GRADIENT_STOPS[GRADIENT_STOPS.length - 1];
            for (let s = 0; s < GRADIENT_STOPS.length - 1; s++) {
                if (t >= GRADIENT_STOPS[s].pos && t <= GRADIENT_STOPS[s + 1].pos) {
                    lower = GRADIENT_STOPS[s];
                    upper = GRADIENT_STOPS[s + 1];
                    break;
                }
            }
            const range = upper.pos - lower.pos;
            const localT = range === 0 ? 0 : (t - lower.pos) / range;
            const r = Math.round(lower.r + (upper.r - lower.r) * localT);
            const g = Math.round(lower.g + (upper.g - lower.g) * localT);
            const b = Math.round(lower.b + (upper.b - lower.b) * localT);
            return `rgb(${r},${g},${b})`;
        }

        // --- Core Logic ---

        /**
         * Generates sequence X_n = (X_{n-1} + X_{n-2}) % mod for a fixed length.
         */
        function generateSequence(x1, x2, mod) {
            const length = SEQUENCE_LENGTH;
            if (mod <= 0) { errorMessage.textContent = "Modulus must be positive."; return []; }

            const seq = [x1, x2];
            if (length < 2) return seq.slice(0, length);

            for (let i = 2; i < length; i++) {
                const nextVal = (BigInt(seq[i - 1]) + BigInt(seq[i - 2])) % BigInt(mod);
                seq.push(Number(nextVal));
            }
            return seq;
        }

        /**
         * Calculates XY coordinates based on sequence, movement directions (sides), and mod value.
         */
        function calculatePathCoords(sequence, mod, sides) {
            let x = 0, y = 0;
            const xCoords = [x], yCoords = [y];
            if (sides < 1) sides = 1;
            const angleIncrementRad = (2 * Math.PI) / sides;
            sequence.forEach((value, i) => {
                const distance = (value === 0) ? mod : value;
                const currentAngleRad = i * angleIncrementRad;
                const dx = Math.cos(currentAngleRad);
                const dy = Math.sin(currentAngleRad);
                x += dx * distance;
                y += dy * distance;
                xCoords.push(x);
                yCoords.push(y);
            });
            return { xCoords, yCoords };
        }

        /**
         * Calculates statistics about the sequence periodicity.
         */
        function calculateSequenceStats(sequence) {
            if (sequence.length < 2) { return { periodSum: null, periodLength: null }; }
            const seenPairs = new Map();
             if (sequence.length >= 2) {
                 seenPairs.set(`${sequence[0]},${sequence[1]}`, 1);
             }
            for (let i = 2; i < sequence.length; i++) {
                const currentPairStr = `${sequence[i-1]},${sequence[i]}`;
                if (seenPairs.has(currentPairStr)) {
                    const k_end = seenPairs.get(currentPairStr);
                    const n_end = i;
                    const periodLength = n_end - k_end;
                    let periodSum = 0;
                    if (k_end >= 0 && n_end > k_end && n_end <= sequence.length) {
                         for (let j = k_end; j < n_end; j++) {
                             if (j >= 0 && j < sequence.length) {
                                 periodSum += sequence[j];
                             }
                         }
                    }
                    return { periodSum: periodSum, periodLength: periodLength };
                } else {
                    seenPairs.set(currentPairStr, i);
                }
            }
            return { periodSum: null, periodLength: null };
        }


        /**
         * Calculates statistics about the path.
         */
        function calculatePathStats(xCoords, yCoords) {
            for (let i = 1; i < xCoords.length; i++) {
                const distanceToOrigin = Math.sqrt(xCoords[i]**2 + yCoords[i]**2);
                if (distanceToOrigin < ORIGIN_THRESHOLD) {
                    return { returnSteps: i };
                }
            }
            return { returnSteps: null };
        }


        /**
         * Draws the calculated path on the canvas with white-to-teal gradient lines and shaded area.
         */
        function drawPath(context, xCoords, yCoords) {
            const width = context.canvas.width; const height = context.canvas.height;
            // Clear to darkest teal background
            context.fillStyle = '#041c1c';
            context.fillRect(0, 0, width, height);

            if (xCoords.length < 2) return;
            let minX = xCoords[0], maxX = xCoords[0], minY = yCoords[0], maxY = yCoords[0];
            for (let i = 1; i < xCoords.length; i++) { minX = Math.min(minX, xCoords[i]); maxX = Math.max(maxX, xCoords[i]); minY = Math.min(minY, yCoords[i]); maxY = Math.max(maxY, yCoords[i]); }
            const pathWidth = maxX - minX; const pathHeight = maxY - minY; if (pathWidth === 0 && pathHeight === 0 && xCoords.length >= 1) { return; } const padding = 40; const effectiveCanvasWidth = width - 2 * padding; const effectiveCanvasHeight = height - 2 * padding; const scaleX = pathWidth === 0 ? 1 : effectiveCanvasWidth / pathWidth; const scaleY = pathHeight === 0 ? 1 : effectiveCanvasHeight / pathHeight; const scale = Math.min(scaleX, scaleY) * 0.95; const centerX = (minX + maxX) / 2; const centerY = (minY + maxY) / 2; const translateX = width / 2 - centerX * scale; const translateY = height / 2 - centerY * scale; const transformedX = xCoords.map(x => translateX + x * scale); const transformedY = yCoords.map(y => translateY + y * scale);

            // --- 1. Draw Shaded Area (Fill) ---
            context.beginPath(); context.moveTo(transformedX[0], transformedY[0]);
            for (let i = 1; i < transformedX.length; i++) { context.lineTo(transformedX[i], transformedY[i]); }
            context.fillStyle = 'rgba(142, 216, 216, 0.08)';
            context.fill();

            // --- 2. Draw Gradient Line Segments (White → Teal) ---
            const totalSegments = transformedX.length - 1;
            context.lineWidth = 1.5; context.lineCap = 'round'; context.lineJoin = 'round';
            for (let i = 0; i < totalSegments; i++) {
                 const x1 = transformedX[i]; const y1 = transformedY[i]; const x2 = transformedX[i+1]; const y2 = transformedY[i+1];
                 const t = totalSegments <= 1 ? 0 : i / (totalSegments - 1);
                 context.strokeStyle = getGradientColor(t);
                 context.beginPath(); context.moveTo(x1, y1); context.lineTo(x2, y2); context.stroke();
             }
        }

        /**
         * Main function to update the visualization and stats based on input values.
         */
        function updateVisualization() {
            errorMessage.textContent = '';
            const mod = parseInt(modInput.value, 10);
            const x1 = parseInt(x1Input.value, 10);
            const x2 = parseInt(x2Input.value, 10);
            const sides = parseInt(sidesInput.value, 10);
            const len = SEQUENCE_LENGTH;

            if (isNaN(mod) || isNaN(x1) || isNaN(x2) || isNaN(sides)) {
                 errorMessage.textContent = "Invalid integer values.";
                 ctx.fillStyle = '#041c1c';
                 ctx.fillRect(0, 0, canvas.width, canvas.height);
                 return;
            }
            if (mod <= 0) {
                errorMessage.textContent = "Modulus must be > 0.";
                ctx.fillStyle = '#041c1c';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }
            if (sides < 1) {
                errorMessage.textContent = "Directions must be >= 1.";
                ctx.fillStyle = '#041c1c';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }

            // --- Calculations ---
            const sequence = generateSequence(x1, x2, mod);
            if (!sequence.length && mod > 0) return;

            const { xCoords, yCoords } = calculatePathCoords(sequence, mod, sides);

            // --- Calculate Stats ---
            const seqStats = calculateSequenceStats(sequence);
            const pathStats = calculatePathStats(xCoords, yCoords);

            // --- Update Info Cards ---
            if (seqStats.periodSum !== null) {
                sequenceInfoCard.innerHTML = `Cycle Sum: ${seqStats.periodSum} <br> (len: ${seqStats.periodLength})`;
            } else {
                sequenceInfoCard.textContent = `Cycle Sum: N/A (in ${len} steps)`;
            }
            if (pathStats.returnSteps !== null) {
                pathInfoCard.textContent = `Origin Return: ${pathStats.returnSteps} steps`;
            } else {
                pathInfoCard.textContent = `Origin Return: N/A`;
            }

            // --- Draw Path ---
            drawPath(ctx, xCoords, yCoords);
        }

        // --- Event Listeners ---
        modInput.addEventListener('input', updateVisualization);
        x1Input.addEventListener('input', updateVisualization);
        x2Input.addEventListener('input', updateVisualization);
        sidesInput.addEventListener('input', updateVisualization);

        // --- Canvas Resizing and Initial Draw ---
        function setCanvasSizeAndDraw() {
            const container = canvas.parentElement;
            const resolution = 600;
            canvas.width = resolution; canvas.height = resolution;
            updateVisualization();
        }
        const resizeObserver = new ResizeObserver(entries => {
            setCanvasSizeAndDraw();
        });
        if (canvas.parentElement) {
            resizeObserver.observe(canvas.parentElement);
        }

        // Perform initial setup and draw when the page loads
        window.addEventListener('load', () => {
            setCanvasSizeAndDraw();
        });

    </script>

</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisano Webs Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FEFF00; /* Yellow background */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: rgba(0, 0, 0, 0.7);
            font-family: sans-serif;
            font-size: 12px;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.5);
            padding: 4px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <canvas id="previewCanvas"></canvas>
    <div id="info">Loading...</div>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');

        let animationFrameId;

        function getPisanoSequence(n1, n2, m) {
            if (m === 1) return [0];
            let seq = [n1 % m, n2 % m];
            const MAX_LEN = 5000;
            while (true) {
                let next = (seq[seq.length - 1] + seq[seq.length - 2]) % m;
                if (next === (n2 % m) && seq[seq.length - 1] === (n1 % m)) {
                    seq.pop();
                    break;
                }
                seq.push(next);
                if (seq.length > MAX_LEN) break;
            }
            return seq;
        }

        function drawLine(ctx, m, val1, val2, radius, center) {
            const angle1 = (Math.PI * 2 * val1) / m - Math.PI / 2;
            const x1 = center + radius * Math.cos(angle1);
            const y1 = center + radius * Math.sin(angle1);
            const angle2 = (Math.PI * 2 * val2) / m - Math.PI / 2;
            const x2 = center + radius * Math.cos(angle2);
            const y2 = center + radius * Math.sin(angle2);

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        function runAnimation(m, n1, n2) {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            // Set canvas size
            const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
            canvas.width = size;
            canvas.height = size;
            const center = size / 2;
            const radius = size / 2 - 10;

            info.textContent = `Mod: ${m}, Start: (${n1},${n2})`;

            const seq = getPisanoSequence(n1, n2, m);

            ctx.clearRect(0, 0, size, size);

            // Draw Circle
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, Math.PI * 2);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#000';
            ctx.stroke();

            ctx.lineWidth = 1.5;

            const TARGET_DURATION = 2000; // 2 seconds to draw
            let startTime = null;
            let currentIndex = 0;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / TARGET_DURATION, 1);
                const targetIndex = Math.floor(progress * seq.length);

                if (currentIndex < targetIndex && currentIndex < seq.length) {
                    while (currentIndex < targetIndex && currentIndex < seq.length) {
                        const startVal = seq[currentIndex];
                        const endVal = seq[(currentIndex + 1) % seq.length];
                        drawLine(ctx, m, startVal, endVal, radius, center);
                        currentIndex++;
                    }
                }

                if (currentIndex < seq.length) {
                    animationFrameId = requestAnimationFrame(animate);
                } else {
                    // Wait a bit then restart
                    setTimeout(randomizeAndRun, 1000);
                }
            }
            requestAnimationFrame(animate);
        }

        function randomizeAndRun() {
            const m = Math.floor(Math.random() * 50) + 10;
            const n1 = Math.floor(Math.random() * 5);
            const n2 = Math.floor(Math.random() * 5) + 1;
            runAnimation(m, n1, n2);
        }

        window.addEventListener('resize', () => {
             // Just let the next cycle handle resize or restart immediately?
             // Restarting immediately provides better UX
             randomizeAndRun();
        });

        randomizeAndRun();

    </script>
</body>
</html>
